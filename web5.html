<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <section class="section">
      <div class="container">
        <div class="coumns is centered"></div>
      </div>
    </section>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"
    />

    <form action="" autocomplete="off" id="formulario">
      <div class="field">
        <label class="label" for="apellidos">Apellidos</label>
        <input
          type="text"
          class="input"
          id="apellidos"
          minlength="3"
          required
        />
      </div>

      <div class="field">
        <label for="nombres" class="label">Nombres</label>
        <input type="text" class="input" id="nombres" minlength="3" required />
      </div>

      <div class="field">
        <label for="fechanac" class="label">Fecha nacimiento</label>
        <input
          type="date"
          class="input"
          id="fechanac"
          min="1999-10-20"
          required
        />
      </div>

      <div class="field">
        <label for="email" class="label">Correo electronico</label>
        <input type="email" class="input" id="email" required />
      </div>

      <div class="field">
        <label for="">Experiencia:</label>
        <input
          type="number"
          min=""
          max="30"
          value="1"
          id="experiencia"
          required
        />
      </div>

      <div class="field">
        <label for="cargo" class="field">Cargo</label>
        <select name="cargo" id="cargo" required>
          <option value=""></option>
          <option value="1">Analista</option>
          <option value="2">Programador</option>
          <option value="3">Jefe</option>
        </select>
      </div>

      <div>
        <button type="submit">Enviar</button>
        <button type="reset">Reiniciar</button>
      </div>
    </form>
    <script>
      //vamos a detner el evento submit (envio)
      //el evento submit esta asociado al formulario y no al boton
      const formulario = document.getElementById("formulario");

      //gestion de enventos
      formulario.addEventListener("submit", function (event) {
        //freno para cualquier evento..
        event.preventDefault();

        if (confirm("¿Esat seguro de prodecer?")) {
        }
      });
    </script>
  </body>
</html>
