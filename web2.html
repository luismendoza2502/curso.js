<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <button id="so">Sistema operativo</button>
    <button id="bd">base de datos</button>
    <button id="lp">lenguaje de programación</button>

    <input type="text" id="mensaje">
    <h1 id="texto"></h1>

    <script>
      const b1 = document.getElementById("so");
      const b2 = document.getElementById("bd");
      const b3 = document.getElementById("lp");
      const caja = document.getElementById("mensaje")
      const contenido = document.getElementById("texto")

      b1.addEventListener("click", function () {
        console.log("Windows 11, linux, Android");
      });

      b2.addEventListener("click", function () {
        console.log("Ms sql server, sqlite");
      });
      b3.addEventListener("click", function () {
        console.log("Python,js,php");
      });
      //Evento de teclado; keyup, keydown, keypress
      caja.addEventListener("keydown", function(){
        //InnerHTML <etiqueta> valor </etiqueta>
        // caja.value, representa el contenido de la cajad de texto 
        contenido.innerHTML = caja.value
        
      })
    </script>
  </body>
</html>
